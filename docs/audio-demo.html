<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Listen to AmbiFlow</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #090812;
      color: white;
      font: 16px system-ui, sans-serif;
    }

    main {
      width: min(90%, 480px);
      padding: 32px;
      border: 1px solid #ffffff18;
      border-radius: 20px;
      background: #ffffff0a;
      text-align: center;
    }

    h1 {
      margin-top: 0;
    }

    audio {
      width: 100%;
      margin-top: 16px;
    }

    a {
      color: #8c8cff;
    }
  </style>
</head>
<body>
  <main>
    <h1>AmbiFlow</h1>
    <p>Listen to a short sample of an evolving ambient soundscape.</p>

    <audio controls preload="metadata">
      <source src="ambiflow-sample.mp3" type="audio/mpeg">
      Your browser does not support audio playback.
    </audio>

    <p><a href="ambiflow-sample.mp3" download>Download the sample</a></p>
  </main>
</body>
</html>
